<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>آفلاین — Pinverse</title>
    <style>
        @font-face {
            font-family: 'Vazir';
            src: url('../src/WebFonts/Vazir/Vazirmatn-Bold.woff2');
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            font-family: 'Vazir';
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fef2f2 0%, #ffffff 50%, #fff7ed 100%);
            color: #374151;
            text-align: center;
            padding: 1.5rem;
        }

        .box { max-width: 380px; animation: fadeInUp 0.5s ease-out both; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.25rem;
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            transform: rotate(3deg);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 0.875rem;
            color: #9ca3af;
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }

        button {
            background: linear-gradient(90deg, #dc2626, #e11d48);
            color: #fff;
            border: 0;
            padding: 0.8rem 2rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.875rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(239, 68, 68, 0.4);
        }

        button:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>اتصال برقرار نیست</h1>
        <p>
            به نظر می‌رسد اینترنت قطع است.
            وقتی وصل شدی دوباره تلاش کن — پین‌هایت منتظرت هستند!
        </p>
        <button onclick="location.reload()">تلاش مجدد</button>
    </div>
</body>
</html>
